packages:
  - apps/website
  - .library/packages/*

managePackageManagerVersions: false
strictPeerDependencies: true

overrides:
  solid-js: 2.0.0-rc.19
  '@solidjs/web': 2.0.0-rc.19
  '@solidjs/signals': 2.0.0-rc.19
  '@solidjs/compiler': 2.0.0-rc.19
  '@solidjs/babel-plugin': 2.0.0-rc.19

# The global 24h minimumReleaseAge stays. Exact-version exceptions only: the Solid 2.0.0-rc.19 tuple
# and matching compiler plugin 3.0.0-next.52. Keep them through this candidate; remove once aged and
# a frozen install proves the same versions resolve without them.
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
  - solid-js@2.0.0-rc.19
  - '@solidjs/web@2.0.0-rc.19'
  - '@solidjs/signals@2.0.0-rc.19'
  - '@solidjs/compiler@2.0.0-rc.19'
  - '@solidjs/compiler-darwin-arm64@2.0.0-rc.19'
  - '@solidjs/compiler-darwin-x64@2.0.0-rc.19'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.19'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0-rc.19'
  - '@solidjs/compiler-wasm32-wasi@2.0.0-rc.19'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0-rc.19'
  - '@solidjs/babel-plugin@2.0.0-rc.19'
  - '@solidjs/vite-plugin@3.0.0-next.52'

# wrangler deploy needs neither: esbuild ships its binary via optional deps, workerd is only for `wrangler dev`.
allowBuilds:
  esbuild: false
  workerd: false
